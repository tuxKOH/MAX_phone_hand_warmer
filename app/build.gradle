plugins { id 'com.android.application' }
def qnnRoot = providers.gradleProperty('qnnSdkRoot').orElse(providers.environmentVariable('QNN_SDK_ROOT')).getOrElse('')
android {
    namespace 'dev.maxheater'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'dev.maxheater'
        minSdk 31
        targetSdk 36
        versionCode 4
        versionName '0.2.2'
        testInstrumentationRunner 'dev.maxheater.SmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DQNN_SDK_ROOT=${qnnRoot}"; cppFlags '-std=c++17 -O3' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libQnnHtpV*Skel.so'] } }
    // Keep native libraries stored in ZIP: some installers fail inflating the
    // large QNN binaries. Legacy extraction still supplies nativeLibraryDir.
    androidResources { noCompress += ['so'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
